name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # C1-05: reporta dependencias vulnerables en cada PR sin bloquear el merge
      # todavía — hoy (2026-08-31) hay altos conocidos en react-router y xlsx que
      # René está resolviendo (R1-01/R1-02 en Tareas_Rene.md). Pasar a bloqueante
      # (quitar `continue-on-error`) en cuanto esos dos estén mergeados y
      # `pnpm audit --prod` salga limpio de altos/críticos.
      - name: Auditoría de dependencias vulnerables (no bloqueante por ahora)
        run: pnpm audit --prod
        continue-on-error: true

      - name: Lint
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run --coverage
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

  # Aplica TODAS las migraciones sobre una base de datos LIMPIA. Esto atrapa
  # automáticamente los bugs de integridad que nos costaron horas: migraciones con
  # DDL `app.*` sin guardia, columnas/funciones que quedan sin crear, overloads
  # ambiguos, etc. Si una migración falla en limpio, el CI falla y NO se mergea.
  migrations:
    name: Migrations · clean DB apply
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase stack (aplica migraciones + seed al arrancar)
        run: supabase start

      - name: Re-aplicar migraciones en BD limpia (sin seed)
        run: supabase db reset --no-seed

      # Ataca el propio stack recién levantado con sesiones de alumno reales:
      # escalada de rol, forjar asistencias, exposición de system_config, lectura
      # de perfiles ajenos (HU-Q01, arnés de RLS — ver rlsSecurity.test.ts). Las
      # claves de acá son las demo fijas de Supabase para stacks locales (siempre
      # las mismas, no son secretos), no las de producción.
      - name: Tests de RLS de seguridad
        run: pnpm exec vitest run src/__tests__/rlsSecurity.test.ts
        env:
          CI_RLS_INTEGRATION: 'true'
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      - name: Stop
        if: always()
        run: supabase stop
